<!-- 
 rowspan is used to merge the row of table
 colspan is used to merge the column of the table 
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2px" width="400px" height="400px">
        <tr>
            <td colspan="2">1</td>
            <td>3</td>
            <td rowspan="3">4</td>
        </tr>
        <tr>
            <td rowspan="2">5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td>10</td>
            <td>11</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td colspan="2">15</td>

        </tr>
    </table>
</body>
</html>
