<!-- 
tr -- table row -- it is used to create the table row
td -- table data -- it is used to create the table column
th -- table heading -- it is used to create the table column
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2px" height="200px" width="200px" bgcolor="pink" bordercolor="red">
        <tr bgcolor="green">
            <td bgcolor="#D62828"> 1</td>
            <td>2</td>
        </tr>
        <tr>
            <td bgcolor="yellow">3</td>
            <td bgcolor="rgb(56,124,60)">4</td>
        </tr>   

        <tr>
            <td bgcolor="#FDC3A1">5</td>
            <td bgcolor="#458B73">6</td>
        </tr>
    </table>
</body>
</html>
