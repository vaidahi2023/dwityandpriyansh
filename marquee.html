<!-- 
 marquee is used to move text or image from one direction to another direction -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- direction 
        value -- left,right,top,bottom -->
    <marquee behavior="" direction="" scrollamount="20">
        <p>this is marquee tag</p>
    </marquee>
    <marquee behavior="" direction="left" scrollamount="20">
        <p>this is marquee tag</p>
    </marquee>
    <marquee behavior="" direction="right" scrollamount="20">
        <p>this is marquee tag</p>
    </marquee>
    <marquee behavior="" direction="up" scrollamount="10" bgcolor="yellow">
        <p>this is marquee tag</p>
    </marquee> 
    <marquee behavior="" direction="down" scrollamount="20" bgcolor="pink" height="300px">
        <p>this is marquee tag</p>
    </marquee>
</body>
</html>
